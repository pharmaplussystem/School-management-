<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10245a"><title>School Monitor</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="auth" class="auth"><div class="authbox"><div class="logo">SM</div><h1>School Monitor</h1><p>Modern school management in one workspace.</p>
<form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><div id="msg"></div></form><small>Supabase authentication</small></div></div>
<div id="app" class="app hidden">
<aside id="side"><div class="brand"><div class="logo">SM</div><div><b>School Monitor</b><small>School Management</small></div><button id="collapse">‹</button></div>
<div class="school"><b>Bright Horizon</b><small>2026 Academic Year</small></div>
<nav>
<label>OVERVIEW</label><button class="nav active" data-page="dashboard">⌂ Dashboard</button>
<label>PEOPLE</label><button class="nav" data-page="students">♙ Students</button><button class="nav" data-page="parents">♧ Parents & Guardians</button><button class="nav" data-page="staff">♟ Staff & Teachers</button>
<label>ACADEMICS</label><button class="nav" data-page="classes">▦ Classes & Subjects</button><button class="nav" data-page="attendance">✓ Attendance</button><button class="nav" data-page="timetable">◷ Timetable</button><button class="nav" data-page="exams">▤ Examinations</button><button class="nav" data-page="reports">⌁ Report Cards</button>
<label>FINANCE</label><button class="nav" data-page="fees">₵ Fees & Payments</button><button class="nav" data-page="expenses">− Expenses</button><button class="nav" data-page="budget">◫ Budget</button>
<label>SYSTEM</label><button class="nav" data-page="messages">✉ Messages</button><button class="nav" data-page="settings">⚙ School Settings</button>
</nav><button id="logout" class="logout">↪ Sign out</button></aside>
<main><header><button id="mobile" class="mobile">☰</button><div class="search">⌕ <input placeholder="Search students, staff, classes, payments..."></div><div class="top">☾　♢ <i>3</i><span class="avatar">VM</span><b>Vincent Matsiko</b><small>Administrator</small></div></header><section id="content"></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script>
</body></html>
